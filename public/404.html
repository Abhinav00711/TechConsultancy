<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found — Revora Consultancy</title>
    <meta name="theme-color" content="#e6e8e1" />
    <script>
      // Honor the theme chosen on the main site; default light.
      ;(function () {
        var t
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', '#0f1316')
        }
      })()
    </script>
    <style>
      /* Standalone Ledger page — no app bundle loads here, so the tokens are
         declared inline. Keep in step with src/index.css. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --bg: #e6e8e1;
        --bg-soft: #f3f5ef;
        --text: #14191c;
        --text-dim: #5a6367;
        --border: rgba(20, 25, 28, 0.14);
        --border-strong: rgba(20, 25, 28, 0.3);
        --mark: #b03a20;
        color-scheme: light;
      }
      /* Dark only when the visitor explicitly chose it on the main site —
         light is the default, matching index.html. */
      :root[data-theme='dark'] {
        --bg: #0f1316;
        --bg-soft: #171c20;
        --text: #e3e5de;
        --text-dim: #99a2a6;
        --border: rgba(227, 229, 222, 0.15);
        --border-strong: rgba(227, 229, 222, 0.32);
        --mark: #e2735a;
        color-scheme: dark;
      }
      body {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px;
        color: var(--text);
        background:
          repeating-linear-gradient(to bottom, transparent 0 3.1rem, var(--border) 3.1rem calc(3.1rem + 1px)),
          var(--bg);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main {
        position: relative;
        max-width: 480px;
        width: 100%;
        background: var(--bg-soft);
        border: 1px solid var(--border-strong);
        border-radius: 3px;
        padding: 40px 36px 36px;
      }
      /* The margin rule, in miniature. */
      main::before {
        content: '';
        position: absolute;
        top: 0; bottom: 0; left: 22px;
        width: 1px;
        background: var(--mark);
        opacity: 0.4;
      }
      .eyebrow {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 0.68rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--mark);
        padding-left: 24px;
      }
      .code {
        margin-top: 14px;
        padding-left: 24px;
        font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
        font-size: clamp(4rem, 16vw, 6.5rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
        color: var(--mark);
      }
      h1 {
        margin-top: 14px;
        padding-left: 24px;
        font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
        font-size: clamp(1.3rem, 4vw, 1.7rem);
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }
      p {
        margin-top: 12px;
        padding-left: 24px;
        color: var(--text-dim);
        font-size: 0.95rem;
      }
      .actions {
        margin-top: 28px;
        padding-left: 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 13px 22px;
        border-radius: 2px;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 600;
        font-size: 0.74rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        border: 1px solid transparent;
        transition: opacity 0.15s ease, border-color 0.15s ease;
      }
      .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
      .btn-primary:hover { opacity: 0.85; }
      .btn-ghost { border-color: var(--border-strong); color: var(--text); }
      .btn-ghost:hover { border-color: var(--mark); }
      :focus-visible { outline: 2px solid var(--mark); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Filing error</span>
      <div class="code">404</div>
      <h1>This page isn't in the ledger.</h1>
      <p>
        The page you're looking for doesn't exist or has moved. Let's get you
        back to something useful.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-ghost" href="/#contact">Talk to us</a>
      </div>
    </main>
  </body>
</html>
