# Build the Vite site and publish dist/ to GitHub Pages.
# Runs on every push to main, or manually from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # PRERENDER_STRICT: the deploy must fail rather than silently publish an
      # empty SPA shell — scripts/prerender.mjs uses the runner's Chrome.
      - run: npm run build
        env:
          PRERENDER_STRICT: '1'
      - uses: actions/configure-pages@v5
        with:
          # Enables GitHub Pages for the repo on first run (source: GitHub Actions)
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
