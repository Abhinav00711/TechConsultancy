# Build the Vite site and publish dist/ to GitHub Pages.
# Runs on every push to main, or manually from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: scripts/prerender.mjs dates each sitemap <lastmod>
          # from the last commit that touched that page's content. The default
          # depth-1 clone has no such commit for most files, so every URL would
          # silently fall back to the build date — the exact behaviour the
          # per-route dating replaced.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Also linted here, not just in ci.yml: this workflow runs on every push
      # to main, and on a two-person team a direct push is a normal event —
      # without this there is no lint gate on that path at all.
      - run: npm run lint
      # PRERENDER_STRICT: the deploy must fail rather than silently publish an
      # empty SPA shell — scripts/prerender.mjs uses the runner's Chrome.
      - run: npm run build
        env:
          PRERENDER_STRICT: '1'
      # Last gate before publish: load every prerendered route in a real
      # (hydrating) browser and refuse to deploy a build whose pages error,
      # lose their H1/JSON-LD, or hydrate without working interactivity
      # (scripts/smoke.mjs).
      - run: npm run smoke
      - uses: actions/configure-pages@v5
        with:
          # Enables GitHub Pages for the repo on first run (source: GitHub Actions)
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
