    <meta name="theme-color" content="#e6e8e1" />
    <!-- Cross-document view transitions: same-origin navigations (home ↔
         service pages ↔ privacy) crossfade instead of hard-cutting, in
         browsers that support it; others ignore the at-rule and navigate
         normally. Inline rather than in the stylesheet because prerendered
         pages defer the stylesheet — the incoming page needs this rule active
         at first render for the transition to run. Reduced-motion visitors
         get the instant cut. -->
    <style>
      @view-transition { navigation: auto; }
      @media (prefers-reduced-motion: reduce) {
        @view-transition { navigation: none; }
      }
    </style>
    <!-- Umami is the only third-party origin on the page; preconnect (not just
         dns-prefetch) so the TLS handshake is done before the beacon fires. -->
    <link rel="preconnect" href="https://cloud.umami.is" crossorigin />
    <script>
      // Set theme before first paint to avoid a flash of the wrong theme
      ;(function () {
        var t
        try { t = localStorage.getItem('theme') } catch (e) {}
        // Default is light (paper is the Ledger baseline); dark only when the
        // visitor has explicitly chosen it via the toggle.
        if (t !== 'light' && t !== 'dark') t = 'light'
        document.documentElement.dataset.theme = t
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'light' ? '#e6e8e1' : '#0f1316')
      })()
    </script>

    <!-- The Cloudflare Insights beacon used to load here. It was removed: its
